<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anamnesis Mundi</title>

  <link
    rel="stylesheet"
    href="style.css?v=20260911-public-mobile-1"
  >
</head>

<body class="chronology-locked">

  <div class="research-note">
    A map for inquiry, not a final authority — use it as a starting point for your own research.
  </div>

  <section class="hero">

    <div class="hero-quote">
      <blockquote>
        “One reads in order to ask questions.”
      </blockquote>

      <cite>
        — Franz Kafka
      </cite>
    </div>

    <div class="hero-content">
      <h1>ANAMNESIS MUNDI</h1>

      <p class="hero-subtitle">
        A journey through origins, the nature of existence, and remembrance.
      </p>

      <a
        class="begin"
        href="#timeline"
        aria-label="Enter the chronology"
        aria-controls="timeline"
        aria-expanded="false"
      >
        <span class="begin-text">
          Enter the chronology
        </span>

        <span
          class="begin-portal"
          aria-hidden="true"
        >
          <span class="begin-node"></span>
          <span class="begin-line"></span>
          <span class="begin-arrow">↓</span>
        </span>
      </a>
    </div>

  </section>

  <main
    class="timeline"
    id="timeline"
    aria-hidden="true"
    inert
  ></main>

  <script src="script.js?v=20260911-public-mobile-1"></script>

</body>
</html>
